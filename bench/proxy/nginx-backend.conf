# Two identical nginx backends on :9001/:9002 — the upstream tier both proxies
# forward to. Runs with one worker pinned by the harness.
worker_processes 1;
daemon off;
pid /home/user/SFL/bench/proxy/logs/backend.pid;
error_log /home/user/SFL/bench/proxy/logs/backend-error.log warn;

events { worker_connections 65536; }

http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_requests 1000000;
  default_type application/octet-stream;

  server {
    listen 9001 reuseport;
    listen 9002 reuseport;
    root /home/user/SFL/bench/proxy/www;
    location = / { return 200 "hello from backend\n"; }
    location = /be { return 200 "$server_port $http_x_forwarded_for\n"; }
    location / { }
  }
}
