# The nginx reverse proxy the SFL proxy is measured against: round-robin over
# the same two backends, with an upstream keep-alive pool to match rproxy's.
# Worker count is templated by the harness via NGINX_WORKERS.
worker_processes 2;
daemon off;
pid /home/user/SFL/bench/proxy/logs/proxy.pid;
error_log /home/user/SFL/bench/proxy/logs/proxy-error.log warn;

events { worker_connections 65536; }

http {
  access_log off;
  tcp_nodelay on;
  keepalive_requests 1000000;

  upstream backends {
    server 127.0.0.1:9001;
    server 127.0.0.1:9002;
    keepalive 256;
    keepalive_requests 1000000;
  }

  server {
    listen 8002 reuseport backlog=4096;
    location / {
      proxy_pass http://backends;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
