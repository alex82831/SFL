<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{title}} — {{site}}</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    pre { background: #f4f4f4; padding: .8rem; overflow-x: auto; }
    code { background: #f4f4f4; padding: .1rem .25rem; }
    table { border-collapse: collapse; } td, th { border: 1px solid #ccc; padding: .3rem .6rem; }
    .meta { color: #667; font-size: .9rem; }
  </style>
</head>
<body>
<p><a href="index.html">← {{site}}</a></p>
<article>
{{{content}}}
<p class="meta">{{date}}{{#tags}} · {{.}}{{/tags}}</p>
</article>
</body>
</html>
