<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SFL chat</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; height: 18rem; overflow-y: auto; padding: .5rem; }
  #log .sys { color: #778; font-style: italic; }
  form { display: flex; gap: .5rem; margin-top: .5rem; }
  input { flex: 1; padding: .4rem; }
</style>
<h1>SFL chat</h1>
<div id="log"></div>
<form id="f"><input id="m" autocomplete="off" placeholder="say something"><button>send</button></form>
<script>
  const log = (text, cls) => {
    const div = document.createElement("div")
    div.textContent = text
    if (cls) div.className = cls
    document.getElementById("log").append(div)
    div.scrollIntoView()
  }
  const ws = new WebSocket(`ws://${location.host}/ws`)
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data)
    log(m.kind === "chat" ? `${m.from}: ${m.text}` : m.text, m.kind === "chat" ? "" : "sys")
  }
  ws.onclose = () => log("disconnected", "sys")
  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault()
    const input = document.getElementById("m")
    if (input.value) ws.send(input.value)
    input.value = ""
  }
</script>
</html>
