name: release

# Pushing a tag like v0.6.0 builds sfl for each platform and publishes a GitHub
# Release with the binaries and their checksums. The release is created by the
# runner's built-in GITHUB_TOKEN, so no personal token or gh login is needed.

on:
  push:
    tags: ['v*']
  # Lets the build be run by hand (from the Actions tab) without releasing, to
  # check it still compiles on the runners.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       asset: sfl-macos-arm64 }
          - { os: macos-15-intel, asset: sfl-macos-x86_64 }
          - { os: ubuntu-latest, asset: sfl-linux-x86_64 }
    runs-on: ${{ matrix.os }}
    # A retired runner label queues forever; a bounded wait fails fast instead,
    # and the release job publishes whatever platforms did build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libunwind-dev libgc-dev libssl-dev zlib1g-dev

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: brew install openssl@3 || true

      - name: Build the native binary
        env:
          SFL_LTO: none
          SFL_BUILD_MODE: releaseFast
        run: sbt nativeLink

      - name: Smoke test
        run: |
          bin=target/scala-3.8.4/sfl
          test "$("$bin" -e 'println(6 * 7)')" = "42"
          "$bin" --version

      - name: Stage the asset
        run: cp target/scala-3.8.4/sfl "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  plugins:
    continue-on-error: true
    # The editor plugins ship with the release: the IntelliJ zip and the VSCode
    # vsix, built from this same tag so their language features always match the
    # binary beside them. Neither needs the sfl binary to build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the IntelliJ plugin
        working-directory: editors/intellij
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon buildPlugin

      - name: Build the VSCode extension
        working-directory: editors/vscode
        run: |
          npm install
          npm run compile
          npx --yes @vscode/vsce package --allow-missing-repository

      - name: Stage the plugins
        run: |
          mkdir -p plugins
          cp editors/intellij/build/distributions/*.zip plugins/
          cp editors/vscode/*.vsix plugins/
          ls -l plugins

      - uses: actions/upload-artifact@v4
        with:
          name: sfl-editor-plugins
          path: plugins/*
          if-no-files-found: error

  release:
    # always(): publish whatever platforms built, rather than blocking the whole
    # release when one of them fails to compile.
    needs: [build, plugins]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Sfl.version
        run: |
          v=$(grep -oE 'val version: String = "[0-9]+\.[0-9]+\.[0-9]+"' \
                src/main/scala/com/fartech/sfl/Sfl.scala | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag  Sfl.version=$v"
          test "$v" = "$tag" || { echo "::error::tag $GITHUB_REF_NAME does not match Sfl.version $v"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sfl-*
          merge-multiple: true

      # The plugins are optional: a release still goes out if their job failed.
      - name: Sort the plugins out of the binaries
        run: |
          mkdir -p plugins
          for f in dist/*.zip dist/*.vsix; do
            [ -e "$f" ] && mv "$f" plugins/ || true
          done
          ls -l plugins || true

      - name: Checksums
        run: |
          cd dist
          ls -l
          test -n "$(ls sfl-* 2>/dev/null)" || { echo "::error::no binaries built for any platform"; exit 1; }
          chmod +x sfl-* 2>/dev/null || true
          sha256sum sfl-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(printf 'Install or update (macOS / Linux):\n\n    curl -fsSL https://raw.githubusercontent.com/alex82831/SFL/main/install.sh | sh\n\nOr download the binary for your platform below, chmod +x, and put it on your PATH. Verify with SHA256SUMS.\n\n**Editor plugins** (built from this tag):\n\n- IntelliJ IDEA (Community or Ultimate): `sfl-intellij-*.zip` — Settings | Plugins | gear | Install Plugin from Disk\n- VS Code: `sfl-lang-*.vsix` — Extensions | ... | Install from VSIX\n\nBoth need the sfl binary above on PATH.\n')
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SFL $GITHUB_REF_NAME" \
            --notes "$notes" \
            dist/sfl-* dist/SHA256SUMS install.sh $(ls plugins/* 2>/dev/null)
