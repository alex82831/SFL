name: ci

# Builds sfl on each platform and runs the test suites, on every push and pull
# request. It shares the build recipe with the release workflow, so a green CI
# means a tag will build too.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libunwind-dev libgc-dev libssl-dev zlib1g-dev

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: brew install openssl@3 || true

      # The build and smoke test gate CI, because they are what a release needs.
      - name: Build the native binary
        env:
          SFL_LTO: none
          SFL_BUILD_MODE: releaseFast
        run: sbt nativeLink

      - name: Smoke test
        run: |
          bin=target/scala-3.8.4/sfl
          test "$("$bin" -e 'println(6 * 7)')" = "42"
          "$bin" --version

      # The full suites report but do not gate yet, while their behaviour on the
      # runners (locale, timing) is settled. Output is captured so a failure can be
      # read from the uploaded artifact.
      - name: JUnit tests
        continue-on-error: true
        run: sbt test 2>&1 | tee junit-${{ matrix.os }}.log

      - name: Behaviour, compiler and package suites
        continue-on-error: true
        run: ./tests/run.sh 2>&1 | tee suites-${{ matrix.os }}.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: '*.log'
          if-no-files-found: ignore
